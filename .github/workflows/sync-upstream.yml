name: Sync upstream

# Fork-only: keeps DCFiendish/aechronis master current with Aechronis/aechronis.
# Merges (never resets or force-pushes), so commits already on master survive,
# and other branches are never touched. On a conflict the job fails and master
# is left exactly as it was.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'DCFiendish/aechronis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - name: Merge upstream master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Aechronis/aechronis.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date."
            exit 0
          fi
          git merge --no-edit upstream/master -m "Merge upstream master"
          git push origin HEAD:master
